# Wavly WiFi — /etc/freeradius/3.0/clients.conf
# Define the MikroTik as the ONLY client. Never 0.0.0.0/0.

client mikrotik-nkawie-1 {
	ipaddr                      = 192.168.88.1/32     # the router's LAN IP — exact host
	secret                      = "PASTE_RADIUS_SHARED_SECRET"   # 40+ random chars; same on router /radius entry
	proto                       = udp
	require_message_authenticator = no                 # hotspot CHAP is fine; set yes if your build sends it
	nas_type                    = mikrotik
	shortname                   = nkawie-1
	virtual_server              = default
}

# Localhost for radtest (remove in production if you don't want admin testing from the Pi):
client localhost {
	ipaddr = 127.0.0.1/32
	secret = "PASTE_LOCAL_TEST_SECRET"
	proto  = udp
	shortname = localhost
}

# If you deploy a SECOND FreeRADIUS for failover, add it to /radius on the ROUTER too
# (RouterOS supports multiple RADIUS servers with timeout/retries).
